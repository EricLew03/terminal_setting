# ~/.config/yazi/yazi.toml

[mgr]
show_hidden = false
sort_dir_first = true

[opener]
edit = [
    { run = 'code -n %s', desc = "Open in VS Code", orphan = true, for = "macos" },
]

[open]
prepend_rules = [
    { url = "*/", use = "edit" },
    { mime = "text/*", use = "edit" },
    { mime = "application/json", use = "edit" },
    { mime = "application/javascript", use = "edit" },
    { mime = "application/x-shellscript", use = "edit" },
    { url = "*.ts", use = "edit" },
    { url = "*.tsx", use = "edit" },
    { url = "*.toml", use = "edit" },
    { url = "*.yml", use = "edit" },
    { url = "*.yaml", use = "edit" },
]
